const W=540, H=960, TOP=124, PLAYER_Y=792, SEA_Y=852;
const PAPER='#e6e1d3', INK='#1d1d1b', BLUE='#1d55e0', BLUE2='#5b8af0', RED='#ec3418', GREEN='#119a4c', ORANGE='#f07a1a';

const FONT_M=s=>`${s}px 'Courier Prime', 'Courier New', monospace`;
const FONT_MB=s=>`bold ${s}px 'Courier Prime', 'Courier New', monospace`;

const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let scale=1, dpr=1;
function fit(){
  const bw=document.body.clientWidth, bh=document.body.clientHeight;
  scale=Math.min(bw/W,bh/H); dpr=Math.min(window.devicePixelRatio||1,2);
  cv.style.width=(W*scale)+'px'; cv.style.height=(H*scale)+'px';
  cv.width=Math.round(W*scale*dpr); cv.height=Math.round(H*scale*dpr);
}
addEventListener('resize',fit); fit();

const imgs=SPR.map(s=>{const i=new Image(); i.src=s.src; return i;});
let dirtyImgs=imgs;
const logo={}; for(const k in LOGOS){ const i=new Image(); i.src=LOGOS[k].src; logo[k]={img:i,ar:LOGOS[k].ar}; }
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const irnd=n=>Math.random()*n|0;
const nonBoss=()=>{ let s; do{ s=irnd(SPR.length); }while(SPR[s].type==='boss'); return s; };

const grain=document.createElement('canvas'); grain.width=W/2; grain.height=H/2;
(()=>{const g=grain.getContext('2d'); const id=g.createImageData(grain.width,grain.height);
 for(let i=0;i<id.data.length;i+=4){const c=Math.random()<.5?0:255; id.data[i]=id.data[i+1]=id.data[i+2]=c; id.data[i+3]=Math.random()<.35?Math.random()*22:0;}
 g.putImageData(id,0,0);})();

let AC=null, master=null, windGain=null, noiseBuf=null, muted=false, lastBlip=0;
try{ muted=localStorage.getItem('pba_muted')==='1'; }catch(e){}
function initAudio(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=muted?0:.55; master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const src=AC.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
    const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=650; bp.Q.value=.7;
    windGain=AC.createGain(); windGain.gain.value=0; src.connect(bp); bp.connect(windGain); windGain.connect(master); src.start();
    try{ const bin=atob(LOGO_SND), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); AC.decodeAudioData(u.buffer,b=>{logoBuf=b;},()=>{}); }catch(e){}
  }catch(e){ AC=null; }
}
function tone(f,dur,type='square',vol=.12,slide=null,delay=0){
  if(!AC) return; const t=AC.currentTime+delay; const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.02);
}
function noise(dur,vol,ftype,freq,delay=0){
  if(!AC) return; const t=AC.currentTime+delay; const s=AC.createBufferSource(); s.buffer=noiseBuf;
  const f=AC.createBiquadFilter(); f.type=ftype; f.frequency.value=freq; const g=AC.createGain();
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); s.connect(f); f.connect(g); g.connect(master); s.start(t,Math.random()); s.stop(t+dur+.02);
}
const sfx={
  fire(){ tone(300,.09,'square',.05,700); },
  clack(){ noise(.06,.5,'highpass',2600); tone(1300,.07,'square',.1,520); tone(1950,.05,'square',.05,null,.04); },
  miss(){ tone(200,.1,'square',.05,140); },
  drop(){ tone(620,.3,'triangle',.07,190); },
  splash(){ noise(.6,.5,'lowpass',800); tone(150,.35,'sine',.22,55); },
  bagged(){ tone(170,.28,'sawtooth',.1,70); noise(.18,.3,'lowpass',500); },
  wave(){ [0,5,7,12].forEach((s,i)=>tone(262*2**(s/12),.13,'square',.07,null,i*.09)); },
  clean(){ [0,4,7,12,16].forEach((s,i)=>tone(392*2**(s/12),.12,'square',.07,null,i*.07)); },
  pede(){ [0,1,0,1,0,1].forEach((s,i)=>tone(110+s*8,.14,'sawtooth',.08,null,i*.15)); },
  over(){ [12,8,5,1,-4].forEach((s,i)=>tone(220*2**(s/12),.26,'sawtooth',.09,null,i*.17)); noise(1.2,.35,'lowpass',600,.2); },
  tick(){ tone(1500,.04,'square',.04); },
  blip(){ if(!AC||AC.currentTime-lastBlip<.04) return; lastBlip=AC.currentTime; tone(1700+Math.random()*600,.035,'sine',.06); },
  crack(){ noise(.14,.4,'highpass',1800); tone(420,.12,'square',.06,110); },
  plop(){ tone(520,.14,'sine',.1,180); },
  combo(){ [0,7,12].forEach((s,i)=>tone(660*2**(s/12),.08,'square',.06,null,i*.05)); },
  select(){ tone(880,.05,'square',.06); }
};
function toggleMute(){ muted=!muted; try{localStorage.setItem('pba_muted',muted?'1':'0');}catch(e){} if(master) master.gain.setTargetAtTime(muted?0:.55,AC.currentTime,.02); }

let scene='boot', sceneT=0, time=0, paused=false, G=null, gi=0, menuSel=0;
let score=0, newBest=false, bests={};
try{ bests=JSON.parse(localStorage.getItem('pba_bests')||'{}')||{}; }catch(e){ bests={}; }
let bags=[], seaBags=[], pops=[], parts=[], streaks=[], ban=null, menuBags=[];
let wind=0, windAmp=20, windBias=0, shake=0;
const player={x:W/2,y:PLAYER_Y,tx:W/2,ty:PLAYER_Y,lean:0,stun:0};
const keys={}; let usePointer=false, pointerDown=false, offX=0, offY=0;

function makeBag(si,h){ const s=SPR[si]; return {si,type:s.type,img:imgs[si],ar:s.ar,h,x:0,y:0,x0:0,rot:0,alpha:1,sc:1,t:Math.random()*10,ft:0,vx:0,vy:0,state:'fall',hitP:false}; }
const bw=b=>b.h*b.ar*b.sc, bh=b=>b.h*b.sc;
const ghostAlpha=b=>.1+.9*Math.pow(.5+.5*Math.sin(b.t*2.2),2);
function pop(x,y,text,size=28,color=INK,life=.9){ pops.push({x,y,text,size,color,t:0,life,rot:rnd(-.12,.12)}); }
function burst(x,y,n,color,spd=260,g=600){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=rnd(.3,1)*spd; parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,t:0,life:rnd(.4,.8),c:color,s:rnd(3,7),g}); } }
function bubble(x,y){ parts.push({x,y,vx:rnd(-10,10),vy:rnd(-70,-40),t:0,life:rnd(.8,1.4),c:INK,s:rnd(2.5,5),g:0,bub:true}); }
function banner(text,sub=null,subBg=null,dur=2,blink=false,bg=INK){ ban={text,sub,subBg,dur,blink,bg,t:0}; }
function toSea(b){
  b.state='sea'; seaBags.push({img:b.img,ar:b.ar,x:clamp(b.x,40,W-40),rot:rnd(-.6,.6),t:Math.random()*6,drift:rnd(-12,12)});
  shake=12; sfx.splash(); burst(b.x,SEA_Y+10,22,BLUE2,320); pop(b.x,SEA_Y-40,'SPLASH',30,BLUE);
}
function die(){
  if(scene!=='play') return; scene='dying'; sceneT=0; sfx.over(); shake=16;
  if(score>(bests[G.id]||0)){ bests[G.id]=score; newBest=true; try{localStorage.setItem('pba_bests',JSON.stringify(bests));}catch(e){} }
}
function moveX(dt,speed){
  const L=keys.ArrowLeft||keys.KeyA, R=keys.ArrowRight||keys.KeyD, px=player.x;
  if(L||R){ player.x+=((R?1:0)-(L?1:0))*speed*dt; player.tx=player.x; }
  else if(usePointer){ player.x+=(player.tx-player.x)*Math.min(1,dt*14*speed/360); }
  player.x=clamp(player.x,32,W-32);
  player.lean+=(clamp((player.x-px)/Math.max(dt,1e-3)/900,-.35,.35)-player.lean)*Math.min(1,dt*10);
}
function move2D(dt,speed,x0,x1,y0,y1){
  const kx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0), ky=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);
  const px=player.x;
  if(kx||ky){ const n=Math.hypot(kx,ky); player.x+=kx/n*speed*dt; player.y+=ky/n*speed*dt; player.tx=player.x; player.ty=player.y; }
  else { const dx=player.tx-player.x, dy=player.ty-player.y, d=Math.hypot(dx,dy), m=speed*1.7*dt; if(d>m){ player.x+=dx/d*m; player.y+=dy/d*m; } else { player.x=player.tx; player.y=player.ty; } }
  player.x=clamp(player.x,x0,x1); player.y=clamp(player.y,y0,y1); player.tx=clamp(player.tx,x0,x1); player.ty=clamp(player.ty,y0,y1);
  player.lean+=(clamp((player.x-px)/Math.max(dt,1e-3)/900,-.35,.35)-player.lean)*Math.min(1,dt*10);
}
function fallMotion(b,dt,mul,lvl){
  b.ft+=dt; b.t+=dt; const hw=bw(b)/2;
  switch(b.type){
    case 'heavy': b.vy+=480*mul*dt; b.x+=wind*.15*dt; b.rot*=.96; break;
    case 'chaser':{ const d=player.x-b.x; b.vx=clamp(b.vx+Math.sign(d)*380*dt,-175,175); b.x+=(b.vx+wind*.2)*dt; b.vy=(135+lvl*5)*mul; b.rot=b.vx/600; break; }
    case 'ghost': b.vy=(95+lvl*4)*mul; b.x0=clamp(b.x0+wind*.5*dt,hw+40,W-hw-40); b.x=b.x0+Math.sin(b.ft*1.6)*40; b.alpha=ghostAlpha(b); break;
    case 'spinner': b.vy=(105+Math.sin(b.ft*3)*50)*mul; b.vx+=(wind*1.1-b.vx)*dt*1.5+Math.sin(b.ft*2.3)*130*dt; b.x+=b.vx*dt; b.rot+=dt*(4+Math.abs(wind)/40)*(b.si%2?1:-1); break;
    case 'inflate': b.vy=(68+lvl*3)*mul; b.x0=clamp(b.x0+wind*.3*dt,hw,W-hw); b.x=b.x0+Math.sin(b.ft*1.2)*30; b.sc=Math.min(2.7,1+b.ft*.5); b.rot=Math.sin(b.ft*2)*.12; break;
    default: b.vy=(120+lvl*6)*mul; b.x0=clamp(b.x0+wind*.4*dt,hw+80,W-hw-80); b.x=b.x0+Math.sin(b.ft*4.2)*80; b.rot=Math.cos(b.ft*4.2)*.35;
  }
  b.y+=b.vy*dt;
  const hw2=bw(b)/2; if(b.x<hw2){ b.x=hw2; b.vx=Math.abs(b.vx); } else if(b.x>W-hw2){ b.x=W-hw2; b.vx=-Math.abs(b.vx); }
}

// ================= drawing helpers =================
function drawBag(b){
  const w=bw(b), h=bh(b); if(!w) return;
  ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.rot); ctx.globalAlpha=b.alpha;
  if(b.sq!==undefined){ const s=Math.sin(b.t*7+b.sq)*.08; ctx.scale(1+s,1-s); }
  ctx.drawImage(b.img,-w/2,-h/2,w,h); ctx.restore();
}
function txt(s,x,y,size,color=INK,kind='d',align='center',maxW=0){
  const f=kind==='d'?FONT_D:kind==='mb'?FONT_MB:FONT_M;
  ctx.font=f(size); ctx.fillStyle=color; ctx.textAlign=align; ctx.textBaseline='middle';
  if(maxW){ const m=ctx.measureText(s).width; if(m>maxW) ctx.font=f(size*maxW/m); }
  ctx.fillText(s,x,y);
}
function stamp(text,y,size,rot,bg=INK,fg=PAPER,pad=16,x=W/2){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
  ctx.font=FONT_D(size); let m=ctx.measureText(text).width, sz=size;
  if(m>W-70){ sz=size*(W-70)/m; ctx.font=FONT_D(sz); m=ctx.measureText(text).width; }
  ctx.fillStyle=bg; ctx.fillRect(-m/2-pad,-sz*.62,m+pad*2,sz*1.24);
  ctx.fillStyle=fg; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(text,0,sz*.04); ctx.restore();
}
function drawLogo(k,cx,cy,w,alpha=1){ const L=logo[k]; if(!L.img.complete) return; const h=w/L.ar; ctx.globalAlpha=alpha; ctx.drawImage(L.img,cx-w/2,cy-h/2,w,h); ctx.globalAlpha=1; }
function cropMarks(){
  ctx.strokeStyle=INK; ctx.lineWidth=1.5; const m=14,l=16;
  [[m,m,1,1],[W-m,m,-1,1],[m,H-m,1,-1],[W-m,H-m,-1,-1]].forEach(([x,y,sx,sy])=>{ ctx.beginPath(); ctx.moveTo(x,y+sy*6); ctx.lineTo(x,y+sy*(6+l)); ctx.moveTo(x+sx*6,y); ctx.lineTo(x+sx*(6+l),y); ctx.stroke(); });
}
function drawStreaks(a=.22){
  ctx.strokeStyle=`rgba(29,29,27,${a})`; ctx.lineWidth=1.5; ctx.beginPath(); const dir=wind>=0?1:-1;
  for(const s of streaks){ ctx.moveTo(s.x,s.y); ctx.lineTo(s.x-dir*s.l*(.5+Math.abs(wind)/120),s.y+Math.sin(s.x*.02)*2); }
  ctx.stroke();
}
function drawSea(layer){
  const base=SEA_Y+layer*26; ctx.beginPath(); ctx.moveTo(-10,H+10);
  for(let x=-10;x<=W+10;x+=8) ctx.lineTo(x,base+Math.sin(x*.032+time*(1.5+layer*.7)+layer*2.3)*6+Math.sin(x*.012-time*.9)*4);
  ctx.lineTo(W+10,H+10); ctx.closePath(); ctx.fillStyle=layer?BLUE:BLUE2; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle=INK; ctx.stroke();
}
function drawSeaBags(){
  for(const s of seaBags){ const h=56, w=h*s.ar; ctx.save(); ctx.translate(s.x,SEA_Y+20+Math.sin(s.t*1.8)*5); ctx.rotate(s.rot+Math.sin(s.t*1.3)*.15); ctx.globalAlpha=.95; ctx.drawImage(s.img,-w/2,-h/2,w,h); ctx.restore(); }
}
function dots(label,x,y,n,filled,color=RED){
  txt(label,x,y,13,INK,'m','left'); ctx.font=FONT_M(13); const off=ctx.measureText(label).width+16;
  for(let i=0;i<n;i++){ ctx.beginPath(); ctx.arc(x+off+i*22,y,7,0,7); if(i<filled){ ctx.fillStyle=color; ctx.fill(); } ctx.lineWidth=2; ctx.strokeStyle=INK; ctx.stroke(); }
}
function windText(x,y,label='wind'){ const lvl=Math.min(5,Math.ceil(Math.abs(wind)/25)); txt(label+' '+(wind>=0?'›':'‹').repeat(Math.max(1,lvl)),x,y,15,INK,'m'); }
function drawPincer(x,y,closed){
  ctx.save(); ctx.translate(x,y); ctx.strokeStyle=INK; ctx.lineWidth=4; ctx.lineCap='round'; const o=closed?4:12;
  ctx.beginPath(); ctx.moveTo(0,4); ctx.quadraticCurveTo(-o-6,-2,-o+2,-16); ctx.moveTo(0,4); ctx.quadraticCurveTo(o+6,-2,o-2,-16); ctx.stroke(); ctx.restore();
}
function rrect(x,y,w,h,r){ ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h); }
function drawMachine(x,y,armOut){
  ctx.save(); ctx.translate(x,y); ctx.rotate(player.lean*.5); if(player.stun>0) ctx.translate(Math.sin(time*60)*3,0);
  ctx.lineCap='round'; ctx.strokeStyle=INK; ctx.lineWidth=5;
  if(!armOut){ ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(0,-34); ctx.stroke(); drawPincer(0,-38,false); }
  ctx.fillStyle=INK; rrect(-30,-16,60,34,6); ctx.fill();
  ctx.fillStyle=PAPER; ctx.font=FONT_MB(13); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('R·E·C',0,1);
  wheels(); ctx.restore();
}
function wheels(){ ctx.fillStyle=INK; ctx.beginPath(); ctx.arc(-18,22,8,0,7); ctx.arc(18,22,8,0,7); ctx.fill(); ctx.fillStyle=PAPER; ctx.beginPath(); ctx.arc(-18,22,3,0,7); ctx.arc(18,22,3,0,7); ctx.fill(); }
function drawBin(x,y){
  ctx.save(); ctx.translate(x,y); ctx.rotate(player.lean*.4); if(player.stun>0) ctx.translate(Math.sin(time*60)*3,0);
  ctx.fillStyle=INK; ctx.beginPath(); ctx.moveTo(-44,-30); ctx.lineTo(44,-30); ctx.lineTo(34,18); ctx.lineTo(-34,18); ctx.closePath(); ctx.fill();
  ctx.fillRect(-48,-36,96,7);
  ctx.fillStyle=player.stun>0?RED:GREEN; ctx.font=FONT_D(15); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(player.stun>0?'YUCK':'CLEAN',0,-4);
  ctx.translate(0,2); wheels(); ctx.restore();
}
function drawBlob(x,y,lx,ly,snorkel=false){
  ctx.save(); ctx.translate(x,y); ctx.rotate(player.lean*.6);
  ctx.fillStyle=INK; ctx.beginPath();
  for(let i=0;i<=24;i++){ const a=i/24*Math.PI*2, r=19+Math.sin(a*3+time*7)*1.6; ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r*.92); }
  ctx.fill();
  ctx.fillRect(-11,14,5,8); ctx.fillRect(6,14,5,8);
  let dx=lx-x, dy=ly-y; const d=Math.hypot(dx,dy)||1; dx=dx/d*2.6; dy=dy/d*2.6;
  ctx.fillStyle=PAPER; ctx.beginPath(); ctx.ellipse(-7,-4,6,7,0,0,7); ctx.ellipse(7,-4,6,7,0,0,7); ctx.fill();
  ctx.fillStyle=INK; ctx.beginPath(); ctx.arc(-7+dx,-4+dy,3,0,7); ctx.arc(7+dx,-4+dy,3,0,7); ctx.fill();
  if(snorkel){ ctx.strokeStyle=INK; ctx.lineWidth=4; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(15,-2); ctx.lineTo(19,-30); ctx.stroke(); ctx.strokeStyle=PAPER; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(-14,-11); ctx.lineTo(14,-11); ctx.stroke(); }
  ctx.restore();
}
function badge(b){
  const x=b.x+bw(b)*.3, y=b.y-bh(b)*.32; ctx.save(); ctx.translate(x,y);
  ctx.fillStyle=b.dirty?RED:GREEN; ctx.beginPath(); ctx.arc(0,0,12,0,7); ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle=INK; ctx.stroke();
  ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.lineCap='round'; ctx.beginPath();
  if(b.dirty){ ctx.moveTo(-5,-5); ctx.lineTo(5,5); ctx.moveTo(5,-5); ctx.lineTo(-5,5); } else { ctx.moveTo(-6,0); ctx.lineTo(-2,5); ctx.lineTo(6,-5); }
  ctx.stroke(); ctx.restore();
}

const G1=(()=>{
  let wave=0, form=null, pede=null, sub='intro', subT=0, dropT=0, combo=0, recycled=0, binPulse=0;
  const claw={on:false,x:0,y:0,phase:'up'};
  function pickSprite(){
    const allowed= wave<2?['zigzag','heavy','spinner']: wave<4?['zigzag','heavy','spinner','chaser']:['zigzag','heavy','spinner','chaser','ghost','inflate'];
    const pool=SPR.map((s,i)=>i).filter(i=>allowed.includes(SPR[i].type)); return pool[irnd(pool.length)];
  }
  function start(){ bags=[]; seaBags=[]; wave=0; combo=0; recycled=0; claw.on=false; player.x=player.tx=W/2; player.y=PLAYER_Y; player.stun=0; next(); }
  function next(){
    wave++; bags=bags.filter(b=>b.state==='caught'); form=null; pede=null; claw.on=false; windBias=0; windAmp=10+wave*17;
    if(wave%3===0) buildPede(); else buildForm();
    sub='intro'; subT=0; dropT=2.2; sfx.wave();
    const s= pede?'THE BAGPEDE IS COMING': wave>=7?'PLASTIC STORM': wave===1?'fsssssshhhh…':'WIND LEVEL '+wave;
    banner('WAVE '+wave,s,pede?RED:(wave===1?null:BLUE),2,!!pede);
    if(pede) setTimeout(()=>sfx.pede(),500);
  }
  function buildForm(){
    const rows=Math.min(2+Math.floor((wave-1)/2),5), cols=5, sx=86, sy=76;
    form={ox:W/2-(cols-1)*sx/2, oy:TOP+46, dir:1, sx, sy, total:rows*cols, speed:24+wave*6};
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){ const b=makeBag(pickSprite(),62); b.state='formation'; b.col=c; b.row=r; bags.push(b); }
    formPos(0,0);
  }
  function buildPede(){
    const n=Math.min(7+Math.floor(wave/3)*2,13), gap=20;
    pede={x:-40,y:TOP+50,dir:1,mode:'h',vdir:1,ty:0,speed:105+wave*7,trail:[],gap,segs:[],shedT:3.2};
    for(let x=-40-(n+2)*gap*3;x<=-40;x+=3) pede.trail.push({x,y:pede.y});
    pede.trail.push({x:-40,y:pede.y});
    for(let i=0;i<n;i++){ const b=makeBag(i===0?1:nonBoss(),i===0?74:58); b.state='pede'; bags.push(b); pede.segs.push(b); }
    placePede(1,true);
  }
  function formPos(dt,k){
    for(const b of bags){ if(b.state!=='formation') continue; b.t+=dt;
      b.x=form.ox+b.col*form.sx+Math.sin(b.t*2+b.col)*4;
      b.y=form.oy+b.row*form.sy+Math.sin(b.t*2.6+b.row)*5-(1-k)*520;
      b.rot=Math.sin(b.t*1.5+b.col)*(b.type==='spinner'?.3:.1); if(b.type==='ghost') b.alpha=ghostAlpha(b); }
  }
  function updateForm(dt){
    const fb=bags.filter(b=>b.state==='formation'); if(!fb.length) return;
    const k=1+(1-fb.length/form.total)*1.6; form.ox+=(form.dir*form.speed*k+wind*.22)*dt;
    let minx=1e9,maxx=-1e9,maxy=0;
    for(const b of fb){ const hx=form.ox+b.col*form.sx; minx=Math.min(minx,hx); maxx=Math.max(maxx,hx); maxy=Math.max(maxy,form.oy+b.row*form.sy); }
    if(maxx>W-44){ form.ox-=maxx-(W-44); if(form.dir>0){ form.dir=-1; form.oy+=22; } }
    if(minx<44){ form.ox+=44-minx; if(form.dir<0){ form.dir=1; form.oy+=22; } }
    formPos(dt,1);
    if(maxy>PLAYER_Y-70) die();
    dropT-=dt;
    if(dropT<=0){ const cols={}; for(const b of fb){ if(!cols[b.col]||cols[b.col].row<b.row) cols[b.col]=b; }
      const c=Object.values(cols); launch(c[irnd(c.length)]); dropT=Math.max(.55,2.5-wave*.2)*rnd(.7,1.3); }
  }
  function launch(b){ b.state='fall'; b.ft=0; b.x0=b.x; b.vx=0; b.hitP=false; b.vy=b.type==='heavy'?40:0; sfx.drop(); }
  function placePede(dt,snap){
    const p=pede, L=p.trail.length;
    p.segs.forEach((b,i)=>{ const pt=p.trail[Math.max(0,L-1-i*p.gap)];
      if(snap){ b.x=pt.x; b.y=pt.y; } else { const k=Math.min(1,dt*14); b.x+=(pt.x-b.x)*k; b.y+=(pt.y-b.y)*k; }
      b.t+=dt; b.rot=Math.sin(b.t*5+i*.8)*.14; if(b.type==='ghost') b.alpha=.35+.65*ghostAlpha(b); });
  }

    else { txt('RIVAL',0,-56,96,INK,'d','center',W-40); txt('WINS',0,40,112,RED,'d','center',W-40); }
    ctx.restore();
    ctx.save(); ctx.translate(W/2-30,190); ctx.scale(6,6); pix(ctx,won==='lose'?SP_OLD:SP_KID,PX,0,0); ctx.restore();
  }
  return {id:'derby', name:'BAG DERBY', title:['BAG','DERBY'], desc:'Pixel fishing. Hook the bags.', icon:4, ctrl:'swipe', over:'custom', noScore:true,
    start, update, draw, hud, ready, onTap(){}, swipeStart, swipeMove, swipeEnd, overTitle,
    stats:()=>'you '+P.pts+'  ·  rival '+Rv.pts};
})();

const GAMES=[G1,G2,G3,G4,G5,G6,G7,G8,G9,G10,G11];

// ================= flow =================
function openGame(i){ gi=i; G=GAMES[i]; scene='ready'; sceneT=0; bags=[]; seaBags=[]; pops=[]; parts=[]; ban=null; windBias=0; windAmp=20; sfx.select(); }
function startPlay(){ initAudio(); score=0; newBest=false; pops=[]; parts=[]; ban=null; paused=false; player.hit=false; player.look=null; player.lean=0; G.start(); scene='play'; sceneT=0; }
function toMenu(){ scene='menu'; sceneT=0; paused=false; ban=null; bags=[]; seaBags=[]; pops=[]; parts=[]; windBias=0; windAmp=30; menuSel=gi; }
function primary(){
  initAudio();
  if(scene==='menu'){ openGame(menuSel); return; }
  if(scene==='ready'){ startPlay(); return; }
  if(scene==='over'){ if(sceneT>1) startPlay(); return; }
  if(paused){ paused=false; return; }
  if(scene==='play') G.onTap();
}
function buttons(){
  if(scene==='boot'||scene==='start') return [];
  if(scene==='menu') return [{id:'snd',x:W-100,y:20,w:74,h:28}];
  return [{id:'menu',x:W/2-80,y:18,w:74,h:28},{id:'snd',x:W/2+6,y:18,w:74,h:28}];
}
const TILE={x:26,y0:316,w:(W-52-10)/2,h:84,gx:10,gy:6};
function tileRect(i){ return {x:TILE.x+(i%2)*(TILE.w+TILE.gx), y:TILE.y0+Math.floor(i/2)*(TILE.h+TILE.gy), w:TILE.w, h:TILE.h}; }
function tileAt(p){ for(let i=0;i<GAMES.length;i++){ const r=tileRect(i); if(p.x>r.x&&p.x<r.x+r.w&&p.y>r.y&&p.y<r.y+r.h) return i; } return -1; }

// ================= input =================
addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  const rep=e.repeat; keys[e.code]=true;
  if(e.code==='KeyM'){ initAudio(); toggleMute(); return; }
  if(scene==='boot') return;
  if(scene==='start'){ if((e.code==='Space'||e.code==='Enter')&&!rep) beginGame(); return; }
  if(scene==='menu'){
    const N=GAMES.length;
    if(e.code==='ArrowDown'||e.code==='KeyS'){ menuSel=(menuSel+2)%N; sfx.select(); }
    else if(e.code==='ArrowUp'||e.code==='KeyW'){ menuSel=(menuSel+N-2)%N; sfx.select(); }
    else if(e.code==='ArrowRight'||e.code==='KeyD'){ menuSel=(menuSel+1)%N; sfx.select(); }
    else if(e.code==='ArrowLeft'||e.code==='KeyA'){ menuSel=(menuSel+N-1)%N; sfx.select(); }
    else if(/^Digit[0-9]$/.test(e.code)){ const d=+e.code.slice(5), i=d===0?9:d-1; if(i<N){ initAudio(); openGame(i); } }
    else if((e.code==='Space'||e.code==='Enter')&&!rep) primary();
    return;
  }
  if(e.code==='Escape'){ if(scene==='play'&&!paused) paused=true; else toMenu(); return; }
  if(e.code==='KeyP'&&scene==='play'){ paused=!paused; return; }
  if(scene==='play'&&!paused&&G.onKey&&!rep) G.onKey(e.code);
  if(rep) return;
  if(e.code==='Space'||e.code==='Enter') primary();
  if((e.code==='ArrowUp'||e.code==='KeyW')&&G&&G.ctrl==='x') primary();
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyA','KeyD','KeyW','KeyS'].includes(e.code)) usePointer=false;
});
addEventListener('keyup',e=>{ keys[e.code]=false; });
function toGame(e){ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H}; }
cv.addEventListener('pointerdown',e=>{
  e.preventDefault(); cv.focus(); const p=toGame(e); pointerDown=true; initAudio();
  if(scene==='boot') return;
  if(scene==='start') return;
  for(const b of buttons()) if(p.x>b.x&&p.x<b.x+b.w&&p.y>b.y&&p.y<b.y+b.h){ if(b.id==='snd') toggleMute(); else toMenu(); return; }
  if(scene==='menu'){ const t=tileAt(p); if(t>=0){ menuSel=t; openGame(t); } return; }
  if(scene==='play'&&!paused&&G.ctrl==='tap'){ G.onPointer(p); return; }
  if(scene==='play'&&!paused&&G.ctrl==='swipe'){ G.swipeStart(p); return; }
  if(scene==='play'&&!paused){
    usePointer=true;
    if(G.ctrl==='x') player.tx=p.x;
    else { offX=player.x-p.x; offY=player.y-p.y; player.tx=player.x; player.ty=player.y; }
  }
  primary();
});
cv.addEventListener('pointermove',e=>{
  const p=toGame(e);
  if(scene==='menu'&&e.pointerType==='mouse'){ const t=tileAt(p); if(t>=0) menuSel=t; return; }
  if(scene!=='play') return;
  if(G.ctrl==='swipe'){ if(pointerDown) G.swipeMove(p); return; }
  if(G.ctrl==='x'){ if(e.pointerType==='mouse'||pointerDown){ player.tx=p.x; usePointer=true; } }
  else if(pointerDown){ player.tx=p.x+offX; player.ty=p.y+offY; usePointer=true; }
  else if(e.pointerType==='mouse'){ player.tx=p.x; player.ty=p.y; usePointer=true; }
});
addEventListener('pointerup',e=>{ pointerDown=false; unlockAudio();
  if(scene==='play'&&G&&G.swipeEnd) G.swipeEnd(toGame(e));
  if(scene==='start'&&e.target===cv&&stP===null){ const p=toGame(e); if(sceneT>.4&&p.y>H*.81&&p.y<H*.89&&Math.abs(p.x-W/2)<130){ toggleMute(); return; } beginGame(); }
});
addEventListener('touchend',unlockAudio,{passive:true});
addEventListener('click',unlockAudio);
addEventListener('pointercancel',()=>pointerDown=false);
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&scene==='play') paused=true; });

// ================= update =================
function update(dt){
  time+=dt; sceneT+=dt;
  wind=windBias+Math.sin(time*.33)*windAmp+Math.sin(time*1.27+1)*windAmp*.35;
  if(AC&&windGain){ const tg=scene==='play'?.025+Math.min(.13,Math.abs(wind)/1300):.015; windGain.gain.setTargetAtTime(tg,AC.currentTime,.3); }
  const nS=Math.min(44,4+Math.abs(wind)/6|0);
  while(streaks.length<nS) streaks.push({x:Math.random()*W,y:rnd(TOP,SEA_Y-20),l:rnd(14,46),s:rnd(.7,1.4)});
  if(streaks.length>nS) streaks.length=nS;
  for(const s of streaks){ s.x+=(wind*3.2*s.s+(wind>=0?18:-18))*dt; if(s.x>W+60) s.x=-60; if(s.x<-60) s.x=W+60; }
  for(const s of seaBags){ s.t+=dt; s.x+=s.drift*dt; if(s.x<30||s.x>W-30) s.drift*=-1; }
  for(const p of pops){ p.t+=dt; p.y-=40*dt; } pops=pops.filter(p=>p.t<p.life);
  for(const p of parts){ p.t+=dt; p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; } parts=parts.filter(p=>p.t<p.life);
  shake=Math.max(0,shake-dt*40);
  if(ban){ ban.t+=dt; if(ban.t>ban.dur) ban=null; }
  if(scene==='start'&&stP!==null&&sceneT-stP>1.45){ stP=null; toMenu(); return; }
  if(scene==='menu'){ for(const b of menuBags){ b.t+=dt; b.y-=b.vy*dt; b.x+=(Math.sin(b.t*.9)*30+wind*.6)*dt; b.rot+=b.vr*dt; if(b.y<-120){ b.y=H+120; b.x=rnd(40,W-40); } if(b.x<-80) b.x=W+80; if(b.x>W+80) b.x=-80; } return; }
  if(scene==='play'||scene==='dying'){ G.update(dt); if(scene==='dying'&&sceneT>1.3){ scene='over'; sceneT=0; } }
}

// ================= screens =================
const SHORT={invaders:'Claw them out of the sky.',survive:'Survive the plastic storm.',clean:'Sort before the sea.',micro:'Grab before they break.',tap:'Tap them out of the air.',maze:'Run. Grab the Möbius.',airjet:'Learn the 7 plastics.',bale:'Match 3 of a kind.',band:'Play the plastics.',sink:'Shred. Sink or float?',derby:'Pixel fishing. Hook bags.'};
function drawMenu(){
  for(const b of menuBags) drawBag(b);
  drawStreaks();
  ctx.save(); ctx.translate(W/2,170); ctx.rotate(-.035);
  ['PLASTIC','BAG','ATTACK!'].forEach((l,i)=>txt(l,0,-80+i*76,86,INK,'d','center',W-70)); ctx.restore();
  stamp('arcade punk ecológico',296,22,-.03,BLUE,'#fff',12);
  GAMES.forEach((g,i)=>{
    const r=tileRect(i), sel=i===menuSel, fg=sel?PAPER:INK;
    if(sel){ ctx.fillStyle=INK; ctx.fillRect(r.x,r.y,r.w,r.h); } else { ctx.strokeStyle=INK; ctx.lineWidth=2.5; ctx.strokeRect(r.x,r.y,r.w,r.h); }
    const si=g.icon, h=48, w=h*SPR[si].ar;
    ctx.save(); ctx.translate(r.x+34,r.y+r.h/2+Math.sin(time*2+i)*3); ctx.rotate(Math.sin(time*1.3+i)*(sel?.15:.06)); ctx.drawImage(imgs[si],-w/2,-h/2,w,h); ctx.restore();
    txt(g.name,r.x+66,r.y+26,19,fg,'d','left',r.w-80);
    txt(SHORT[g.id]||g.desc,r.x+67,r.y+48,11,fg,'m','left',r.w-76);
    txt(bests[g.id]?'best '+bests[g.id]:'not played yet',r.x+67,r.y+66,10,sel?'#b5ae9b':'#6d6858','m','left');
    txt(i<10?String((i+1)%10):'',r.x+r.w-9,r.y+13,12,fg,'mb','right');
  });
  drawLogo('lpm',W/2,884,240);
  txt('pick a game: tap, number keys or arrows',W/2,918,13,INK,'m');
}
function drawReady(){
  drawStreaks();
  if(G.title){ ctx.save(); ctx.translate(W/2,206); ctx.rotate(-.035); G.title.forEach((l,i)=>txt(l,0,-44+i*84,92,INK,'d','center',W-60)); ctx.restore(); }
  G.ready();
  if(Math.floor(time*2.2)%2===0) stamp('TAP OR PRESS SPACE',790,30,0);
  txt('best '+(bests[G.id]||0),W/2,846,14,INK,'m');
  drawLogo('lpm',W/2,900,200);
}
function drawHUD(){
  if(!G.noScore){ txt(String(score).padStart(6,'0'),26,56,40,INK,'d','left'); txt('score',28,26,15,INK,'m','left'); }
  G.hud();
  ctx.strokeStyle=INK; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(22,TOP-6); ctx.lineTo(W-22,TOP-6); ctx.stroke();
}
function drawButtons(){
  for(const b of buttons()){ ctx.fillStyle=PAPER; ctx.fillRect(b.x,b.y,b.w,b.h); ctx.strokeStyle=INK; ctx.lineWidth=2; ctx.strokeRect(b.x,b.y,b.w,b.h);
    txt(b.id==='menu'?'menu':(muted?'snd off':'snd on'),b.x+b.w/2,b.y+b.h/2+1,14,INK,'m'); }
}
function drawBanner(){
  if(!ban) return; const k=Math.min(1,ban.t/.25);
  ctx.save(); ctx.globalAlpha=ban.t>ban.dur-.3?Math.max(0,(ban.dur-ban.t)/.3):1;
  stamp(ban.text,H/2-60,78*(.6+.4*k),-.04,ban.bg,ban.bg===INK?PAPER:'#fff');
  if(ban.sub){ if(!ban.subBg) txt(ban.sub,W/2,H/2+20,26,INK,'m'); else if(!ban.blink||Math.floor(time*6)%2===0) stamp(ban.sub,H/2+20,30,.03,ban.subBg,'#fff'); }
  ctx.restore();
}
function drawOver(){
  ctx.fillStyle='rgba(230,225,211,.92)'; ctx.fillRect(0,0,W,H);
  const k=Math.min(1,sceneT/.35), s=1+(1-k)*.6;
  if(G.over==='tmp'){
    const si=G.overBag, h=250, w=h*SPR[si].ar; ctx.save(); ctx.globalAlpha=.9; ctx.translate(W/2,270); ctx.rotate(Math.sin(time)*.1+.08); ctx.drawImage(imgs[si],-w/2,-h/2,w,h); ctx.restore();
    ctx.save(); ctx.translate(W/2,470); ctx.scale(s,s); ctx.rotate(-.04); txt('TOO MUCH',0,-56,96,INK,'d','center',W-40); txt('PLASTIC',0,40,112,RED,'d','center',W-40); ctx.restore();
  } else if(G.over==='custom'){ G.overTitle(s);
  } else {
    ctx.save(); ctx.translate(W/2,380); ctx.scale(s,s); ctx.rotate(-.03); drawLogo(G.over,0,0,G.over==='sop'?400:470); ctx.restore();
  }
  txt('Try again. The ocean needs you.',W/2,590,20,INK,'m');
  txt(String(score).padStart(6,'0'),W/2,652,48,INK,'d');
  txt(newBest?'new best!':'best '+(bests[G.id]||0),W/2,694,16,newBest?RED:INK,'m');
  txt(G.stats(),W/2,722,16,INK,'m','center',W-60);
  if(sceneT>1&&Math.floor(time*2.2)%2===0) stamp('TAP TO TRY AGAIN',800,30,0);
}
function drawParts(){
  for(const p of pops){ const k=p.t/p.life; ctx.save(); ctx.globalAlpha=1-Math.pow(k,3); ctx.translate(p.x,p.y); ctx.rotate(p.rot); const s=k<.15?1+(.15-k)*3:1; ctx.scale(s,s); txt(p.text,0,0,p.size,p.color); ctx.restore(); }
  for(const p of parts){ ctx.globalAlpha=1-p.t/p.life; if(p.smoke){ ctx.globalAlpha*=.5; ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.s*(1+p.t),0,7); ctx.fill(); } else if(p.bub){ ctx.strokeStyle=INK; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,7); ctx.stroke(); } else { ctx.fillStyle=p.c; ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s); } }
  ctx.globalAlpha=1;
}
function draw(){
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  ctx.fillStyle=PAPER; ctx.fillRect(0,0,W,H); ctx.globalAlpha=.9; ctx.drawImage(grain,0,0,W,H); ctx.globalAlpha=1;
  if(scene==='boot'||scene==='start'){ drawStart(); return; }
  if(scene==='menu') drawMenu();
  else if(scene==='ready') drawReady();
  else {
    ctx.save(); if(shake>0) ctx.translate(rnd(-shake,shake)*.6,rnd(-shake,shake)*.6);
    if(G.clip){ ctx.beginPath(); ctx.rect(-20,TOP-4,W+40,H); ctx.clip(); }
    G.draw(); drawParts(); ctx.restore();
    drawHUD(); drawBanner();
    if(scene==='over'||(scene==='dying'&&sceneT>.9)) drawOver();
    if(paused){ ctx.fillStyle='rgba(230,225,211,.88)'; ctx.fillRect(0,0,W,H); stamp('PAUSED',H/2-20,80,-.03); txt('tap or press space to continue',W/2,H/2+50,16,INK,'m'); }
  }
  drawButtons(); cropMarks();
}

let last=performance.now();
function loop(now){ const dt=Math.min(.033,(now-last)/1000); last=now; if(!paused) update(dt); draw(); requestAnimationFrame(loop); }
function makeDirty(){
  dirtyImgs=imgs.map(im=>{ const c=document.createElement('canvas'); c.width=im.naturalWidth||1; c.height=im.naturalHeight||1; const g=c.getContext('2d');
    g.drawImage(im,0,0); g.globalCompositeOperation='source-atop'; g.fillStyle='rgba(86,62,16,.45)'; g.fillRect(0,0,c.width,c.height);
    g.fillStyle='rgba(40,28,6,.5)'; for(let i=0;i<7;i++){ g.beginPath(); g.ellipse(Math.random()*c.width,Math.random()*c.height,rnd(8,26),rnd(6,18),Math.random()*3,0,7); g.fill(); }
    return c; });
}
let loadN=0, loadTotal=0;
const track=p=>{ loadTotal++; return p.catch(()=>{}).then(()=>{ loadN++; }); };
const bootT0=performance.now();
try{ const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext; const oc=new OAC(1,44100,44100); const bin=atob(LOGO_SND), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); const pr=oc.decodeAudioData(u.buffer,b=>{logoBuf=b;},()=>{}); if(pr&&pr.catch) pr.catch(()=>{}); }catch(e){}
Promise.all([
  ...imgs.map(i=>track(i.decode?i.decode():Promise.resolve())),
  ...Object.values(logo).map(l=>track(l.img.decode?l.img.decode():Promise.resolve())),
  track(iconSheet.decode?iconSheet.decode():Promise.resolve()),
  track(document.fonts?Promise.race([Promise.all([document.fonts.load(FONT_D(40)),document.fonts.load(FONT_M(16)),document.fonts.load(FONT_MB(16))]),new Promise(r=>setTimeout(r,2500))]):Promise.resolve())
]).then(()=>{
  makeDirty(); makeGreen(); try{ buildIcons(); }catch(e){ ICONS=null; }
  for(let i=0;i<7;i++){ const b=makeBag([0,8,2,12,7,4,10][i],rnd(80,130)); b.x=rnd(30,W-30); b.y=rnd(0,H); b.vy=rnd(12,30); b.vr=rnd(-.3,.3); b.rot=rnd(-.5,.5); b.alpha=.14; menuBags.push(b); }
  setTimeout(()=>{ scene='start'; sceneT=0; }, Math.max(0,1300-(performance.now()-bootT0)));
});
const hz=m=>440*Math.pow(2,(m-69)/12);
function logoSynth(){ [[84,0],[88,.065],[91,.13]].forEach(([m,d])=>tone(hz(m),.09,'square',.055,null,d+.02));
  [96,100,103].forEach(m=>{ tone(hz(m),1.1,'sine',.06,null,.22); tone(hz(m-12),.8,'triangle',.025,null,.22); });
  for(let i=0;i<6;i++) tone(hz(103+irnd(13)),.18,'sine',.014,null,.32+i*.06); }
function playLogo(){ if(!AC) return; if(logoBuf){ const s=AC.createBufferSource(); s.buffer=logoBuf; const g=AC.createGain(); g.gain.value=1.45; s.connect(g); g.connect(master); s.start(); } else logoSynth(); }
let unlocked=false;
function unlockAudio(){
  initAudio(); if(!AC) return;
  if(AC.state!=='running'){ try{ AC.resume(); }catch(e){} }
  if(unlocked&&AC.state==='running') return;
  try{ const b=AC.createBuffer(1,1,22050), s=AC.createBufferSource(); s.buffer=b; s.connect(AC.destination); s.start(0); unlocked=true; }catch(e){}
}
function beginGame(){ if(stP!==null) return; unlockAudio(); stP=sceneT; setTimeout(playLogo,80); }
function marquee(y,rot,dir,label){
  ctx.save(); ctx.translate(W/2,y); ctx.rotate(rot); ctx.fillStyle=INK; ctx.fillRect(-W,-26,W*2,52);
  ctx.font=FONT_D(28); ctx.fillStyle=PAPER; ctx.textAlign='left'; ctx.textBaseline='middle';
  const seg=ctx.measureText(label).width; let x=-W-((time*55*dir)%seg+seg)%seg;
  for(;x<W;x+=seg) ctx.fillText(label,x,2);
  ctx.restore();
}
function drawStart(){
  ctx.fillStyle=PAPER; ctx.fillRect(0,0,W,H); ctx.globalAlpha=.9; ctx.drawImage(grain,0,0,W,H); ctx.globalAlpha=1;
  marquee(64,-.045,1,'SICK OF PLASTIC  ·  '); marquee(H-70,.04,-1,'SICK OF PLASTIC  ·  ');
  const q=stP===null?0:sceneT-stP, bump=q>0?1+.22*Math.sin(Math.min(1,q/.35)*Math.PI)+.08*Math.sin(q*30)*Math.max(0,1-q*2):1;
  const L=logo.wasInk; if(L.img.complete&&L.img.naturalWidth){ ctx.save(); ctx.translate(W/2,H*.37); ctx.scale(bump,bump); ctx.rotate(time*Math.PI*2/20); ctx.drawImage(L.img,-160,-160,320,320); ctx.restore(); }
  if(stP!==null){ ctx.save(); ctx.globalAlpha=Math.max(0,.6-q); ctx.strokeStyle=INK; ctx.lineWidth=10; ctx.beginPath(); ctx.arc(W/2,H*.37,170+q*300,0,7); ctx.stroke(); ctx.restore(); cropMarks(); return; }
  if(scene==='boot'){
    const p=loadTotal?loadN/loadTotal:0, x0=W*.24, x1=W*.76, y=H*.645;
    const skew=(x,w,c)=>{ ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(x,y+1.5); ctx.lineTo(x+w,y); ctx.lineTo(x+w-2,y+15); ctx.lineTo(x+2,y+13.5); ctx.closePath(); ctx.fill(); };
    skew(x0,x1-x0,'rgba(29,29,27,.15)'); if(p>0) skew(x0,(x1-x0)*p,INK);
    ctx.save(); if('letterSpacing' in ctx) ctx.letterSpacing='4px'; txt('LOADING…',W/2,H*.72,17,INK,'mb'); ctx.restore();
    cropMarks(); return;
  }
  const pop=(d)=>{ const k=clamp((sceneT-d)/.55,0,1), c1=1.70158, c3=c1+1; return k<=0?0:1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2); };
  const s1=pop(0); if(s1>0){ ctx.save(); ctx.translate(W/2,H*.66); ctx.rotate(-3*Math.PI/180); ctx.scale(s1,s1);
    ctx.font=FONT_D(58); const m=ctx.measureText('START!').width; ctx.fillStyle=INK; ctx.fillRect(-m/2-30,-42,m+60,80);
    ctx.fillStyle=PAPER; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('START!',0,2); ctx.restore(); }
  const s2=pop(.35); if(s2>0){ ctx.save(); ctx.translate(W/2,H*.8); ctx.scale(s2,s2); txt(muted?'sound off 🔇':'sound on 🔊',0,0,19,INK,'mb'); ctx.restore(); }
  cropMarks();
}
requestAnimationFrame(loop);
</script>
