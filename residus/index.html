  R(x-9,by-26,18,26,K.ink); R(x-8,by-25,16,24,lit?b.l:b.c); R(x-7,by-23,2,18,K.white);
  R(x-4,by-34,8,9,K.ink); R(x-3,by-33,6,8,lit?b.l:b.c);
  R(x-5,by-37,10,4,K.ink); R(x-4,by-36,8,2,K.silver);
  if(lit){ [[-14,-30],[14,-30],[0,-44],[-12,-10],[12,-10]].forEach(([dx,dy])=>R(x+dx-1,by+dy-1,3,3,HY)); }
}
function noteSnd(f){ if(audioMode===2||!AC) return; beep([f],0.28,'triangle',0.09); }
function winkyInit(F){
  F.level=0; F.seq=[]; F.inp=0; F.mist=0; F.phase='wait'; F.pt=0; F.lit=-1; F.litT=0;
  for(let i=0;i<2;i++) F.seq.push((Math.random()*4)|0);
  say('Escolta la cançó de les ampolles i repeteix-la tocant-les en el mateix ordre!',{title:'Clinc-clinc amb en Winky',portrait:pWinky});
}
function winkyLight(F,i){ F.lit=i; F.litT=0.35; noteSnd(BOT[i].f); }
function winkyUpdate(F,dt){
  F.pt+=dt; if(F.litT>0){ F.litT-=dt; if(F.litT<=0) F.lit=-1; }
  if(F.phase==='wait'&&F.pt>1.6&&tbDone()){ F.phase='show'; F.pt=0; F.si=0; }
  if(F.phase==='show'){ const idx=Math.floor((F.pt-0.4)/0.62);
    if(F.pt>=0.4&&idx<F.seq.length&&idx>=F.si){ winkyLight(F,F.seq[idx]); F.si=idx+1; }
    if(F.pt>0.4+F.seq.length*0.62+0.2){ F.phase='input'; F.inp=0; F.pt=0; } }
  if(F.phase==='sneeze'&&F.pt>1.4){ F.phase='show'; F.pt=0; F.si=0; }
  if(F.phase==='good'&&F.pt>1.0){ F.level++;
    if(F.level>=3){ F.phase='done'; F.pt=0; }
    else { F.seq.push((Math.random()*4)|0); F.phase='show'; F.pt=0; F.si=0; } }
  if(F.phase==='done'&&F.pt>0.8&&!F.over) friendFinish(F.mist<=2,'Clinc! Vidre net i cap a dins! I recorda: taps, miralls i ceràmica no són vidre.','Winky',pWinky);
}
function winkyTap(F,x,y){
  if(F.phase!=='input') return;
  const i=BOT.findIndex(b=>Math.abs(x-b.x)<15&&y>96&&y<146); if(i<0) return;
  winkyLight(F,i);
  if(i===F.seq[F.inp]){ F.inp++; if(F.inp>=F.seq.length){ F.phase='good'; F.pt=0; setTimeout(()=>SFX.good(),250); } }
  else { F.mist++; F.phase='sneeze'; F.pt=0; SFX.bad(); }
}
function winkyDraw(F,t){
  background(0,t);
  R(100,140,136,8,K.ink); R(101,141,134,6,K.brown); R(101,141,134,1,K.tan); R(104,148,3,2,K.ink); R(229,148,3,2,K.ink);
  BOT.forEach((b,i)=>bottle(b,F.lit===i));
  const top=chr(CAST[2],52,146,t,{jump:F.phase==='good'||F.phase==='done'?Math.abs(Math.sin(t*8))*4:0});
  winky(52,top+4,t,{sing:F.phase==='show',sneeze:F.phase==='sneeze',wink:F.phase==='good'||F.phase==='done'});
  if(F.phase==='sneeze') bubble('ATXIM!',70,top-40);
  const label=F.phase==='show'?'ESCOLTA...':F.phase==='input'?'ARA TU!':F.phase==='good'?'MOLT BÉ!':'';
  if(label) ptxtC(label,170,82,K.ink,2,'outline',K.white);
  for(let i=0;i<3;i++) spr(i<F.level?STAR:STAR_OFF,268+i*14,160,1);
}

/* --- Chippy: xip-xip, alarma! --- */
const PACKS=['can','pbottle','bric'], BADS=['duck','pan','plate','robot','bulbS'];
const INAME={can:'una llauna',pbottle:'una ampolla de plàstic',bric:'un bric',duck:'un ànec de goma',pan:'una paella',plate:'un plat',robot:'una joguina',bulbS:'una bombeta'};
let MX=-99, MY=-99;
function chippyInit(F){
  const q=[]; for(let i=0;i<7;i++) q.push({k:PACKS[(Math.random()*3)|0],bad:false});
  shuffle(BADS.slice()).forEach(k=>q.push({k,bad:true}));
  F.queue=shuffle(q); F.items=[]; F.spawnT=1.8; F.misses=0; F.mist=0; F.bub=null; F.sad=0; F.happy=0; F.end=0;
  say('Xip-xip! Toca els objectes que NO són envasos abans que arribin al Brickly!',{title:'Alarma amb en Chippy',portrait:pChippy});
}
function chippyUpdate(F,dt){
  if(!tbDone()) return;
  F.spawnT-=dt; if(F.spawnT<=0&&F.queue.length){ F.items.push({...F.queue.shift(),x:-14,st:'belt',t:0,sh:0}); F.spawnT=1.6; }
  F.items.forEach(it=>{ it.t+=dt; if(it.sh>0) it.sh-=dt;
    if(it.st==='belt'){ it.x+=30*dt; if(it.x>=272){ it.st='drop'; it.t=0;
      if(it.bad){ F.misses++; F.sad=1.2; SFX.bad(); F.bub={t:1.6,txt:`Ep! ${INAME[it.k]} no és per a mi!`,x:250,y:96}; }
      else { F.happy=0.5; beep([880,1175],0.05); } } }
  });
  F.items=F.items.filter(it=>!((it.st==='drop'&&it.t>0.45)||(it.st==='out'&&it.t>0.7)));
  if(F.sad>0) F.sad-=dt; if(F.happy>0) F.happy-=dt;
  if(F.bub){ F.bub.t-=dt; if(F.bub.t<=0) F.bub=null; }
  if(!F.queue.length&&!F.items.length){ F.end+=dt; if(F.end>0.8&&!F.over) friendFinish(F.misses+F.mist<=1,'Taps i llaunes? Xip-xip! Som-hi, Brickly! I recorda: joguines, paelles i plats no són envasos.','Chippy',pChippy); }
}
function chippyTap(F,x,y,kb){
  let best=null;
  if(kb){ best=F.items.filter(it=>it.st==='belt'&&it.bad).sort((a,b)=>b.x-a.x)[0]; }
  else best=F.items.find(it=>it.st==='belt'&&Math.abs(it.x-x)<15&&y>98&&y<142);
  if(!best) return;
  if(best.bad){ best.st='out'; best.t=0; beep([1568,2093,1568],0.05); F.bub={t:1.3,txt:`xip-xip! ${INAME[best.k]} fora!`,x:best.x,y:70}; }
  else { F.mist++; best.sh=0.5; SFX.bad(); F.bub={t:1.6,txt:`${INAME[best.k]}: sí que és envàs!`,x:best.x,y:70}; }
}
function chippyDraw(F,t){
  background(0,t);
  R(0,128,276,6,K.ink); R(0,129,276,4,K.dark);
  const off=Math.floor(t*30)%8; for(let x=off;x<274;x+=8) R(x,130,3,1,K.silver);
  for(let x=20;x<276;x+=60) R(x,134,3,12,K.ink);
  F.items.forEach(it=>{
    if(it.st==='belt'){ const dx=it.sh>0?Math.round(Math.sin(it.t*50)*2):0; drawItemK(it.k,it.x+dx,128,2); }
    else if(it.st==='drop'){ const p=seg(it.t,0,0.45); drawItemK(it.k,lerp(272,292,p),lerp(128,112,p)-Math.sin(p*Math.PI)*14,2); }

  });
  chr(CAST[1],292,146,t,{lidOpen:true,sad:F.sad>0,jump:F.happy>0?3:0});
  const target=F.items.filter(it=>it.st==='belt'&&it.bad).sort((a,b)=>b.x-a.x)[0];
  const cx=target?Math.min(250,Math.max(30,target.x)):160;
  F.cx=F.cx==null?cx:lerp(F.cx,cx,0.06);
  chippy(F.cx,92+Math.sin(t*5)*3,t,{fly:true});
  if(target&&target.x>170&&Math.floor(t*4)%2) ptxt('!',F.cx+10,62,BOOT,2,'outline',K.ink);

}

/* ---------- game state ---------- */
let screen='title', T=0, WT=1;
let order=[0,1,2,3,4,5], ri=0, stars=[], mistakes=0;
let C={phase:'wait',pt:0,target:-1};
let J=null;
let introPage=0;
function setScreen(s){ screen=s; WT=0; BTN=null; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

const INTRO=[
  'Hola, nous amics! Jo sóc el Sr. Moebius, i avui... tenim una missió ben important.',
  "Quan llencem un residu al contenidor, la història no s'acaba: comença un viatge!",
  'Ajuda la família a guardar cada residu al seu lloc. I recordeu: primer mirem, després llencem!'
];
function newGame(){ ri=0; stars=[]; bonus=0; maxBonus=0; guestPool=shuffle(GUESTS.slice()); shuffle(order); }
function startIntro(){ setScreen('intro'); introPage=0; showIntro(); }
function showIntro(){ say(INTRO[introPage],{portrait:pMoebius,next:true,title:'Sr. Moebius',onNext:()=>{ introPage++; if(introPage<INTRO.length) showIntro(); else { newGame(); startChoose(); } }}); }

function itemPortrait(s){ return (cx,bottom,t)=>{
  const hide=C.phase==='fly'||(C.phase==='wrong'&&C.pt<0.5)||C.phase==='right';
  if(!hide){ const sp=ITEMS[s.cur.k]; const b=Math.round(Math.sin(t*4)); spr(sp,cx-sp[0].length,bottom-sp.length*2-6+b,2); }
}; }
function startChoose(){
  mistakes=0; setScreen('choose'); C={phase:'wait',pt:0,target:-1};
  const ci=order[ri], s=CAST[ci]; const pool=POOLS[ci];
  s.cur=pool[(Math.random()*pool.length)|0]; s.item=s.cur.k;
  say(`On ha d'anar ${s.cur.l}? Toca el personatge correcte!`,{title:`Viatge ${ri+1} de 6`,portrait:itemPortrait(s)});
}
function pick(i){ if(C.phase!=='wait') return; SFX.tap(); C={phase:'fly',pt:0,target:i}; }
function startJourney(){
  const s=CAST[order[ri]];
  setScreen('journey'); J={s,phase:'call',pt:0};
  say(s.call||'El contenidor és ple! Toca el camió per cridar-lo.',{title:'1. La recollida',portrait:s});
}
function finishRound(){ stars[ri]=Math.max(1,3-mistakes); setScreen('stars'); tb=null; SFX.star(); }
function nextRound(){ ri++; if(ri<6) startChoose(); else startEnd(); }
function restart(){ newGame(); startChoose(); }

function jTx(){
  if(!J) return -90;
  switch(J.phase){
    case 'call': return -12;
    case 'arrive': return lerp(-12,95,easeOut(seg(J.pt,0,1.4)));
    case 'lift': return 95;
    case 'drive': return 95+280*ease(seg(J.pt,0,3.2));
    default: return 375;
  }
}

function update(dt){
  T+=dt; WT+=dt;
  if(tb) tb.n+=dt*32;
  if(screen==='choose'){
    C.pt+=dt;
    if(C.phase==='fly'&&C.pt>=0.5){
      const s=CAST[C.target], ans=CAST[order[ri]], right=C.target===order[ri];
      if(right){ C.phase='right'; C.pt=0; SFX.good();
        say(ans.cur.ok||s.ok,{title:'Molt bé!',portrait:s,next:true,onNext:startJourney}); }
      else { C.phase='wrong'; C.pt=0; mistakes++; SFX.bad();
        let txt=`Ui! ${s.tag} diu: això no és meu! Torna-ho a provar.`;
        if(mistakes>=2) txt=`Ui! Això no va aquí. ${ans.cur.hint||ans.hint}`;
        say(txt,{title:`Viatge ${ri+1} de 6`,portrait:itemPortrait(ans)}); }
    }
    if(C.phase==='wrong'&&C.pt>=0.9) C.phase='wait';
  }
  if(J&&(screen==='journey'||screen==='stars')){
    J.pt+=dt; const s=J.s;
    if(J.phase==='arrive'&&J.pt>=1.4){ J.phase='lift'; J.pt=0; SFX.clank(); }
    else if(J.phase==='lift'&&J.pt>=1.2){ J.phase='drive'; J.pt=0; say(s.drive,{title:'2. El transport',portrait:s}); }
    else if(J.phase==='drive'&&J.pt>=3.2){ J.phase='machine'; J.pt=0; say(s.machine,{title:'3. La planta',portrait:s}); }
    else if(J.phase==='process'&&J.pt>=2.2){ J.phase='product'; J.pt=0;
      if(s.prod==='pile'){ SFX.sad(); say("Què ha passat? Toca la muntanya de l'abocador!",{title:'4. El resultat',portrait:s}); }
      else { SFX.pop(); say('Què ha sortit de la màquina? Toca-ho per descobrir-ho!',{title:'4. El resultat',portrait:s}); } }
  }
  if(screen==='friend'&&FG){ FG.t+=dt; const G=GAMES[FG.kind]; if(G.update) G.update(FG,dt); }
  if(screen==='guest'&&GS) guestUpdate(dt);
}

/* ---------- input ---------- */
function onTap(x,y){
  startAudio();
  if(inR(x,y,SND)){ cycleAudio(); return; }
  if(tb&&!tbDone()&&(tb.next||inR(x,y,tb.rect))){ tb.n=tb.len; return; }
  if(tb&&tb.next&&tbDone()){ const f=tb.onNext; tb=null; SFX.tap(); f&&f(); return; }
  if(screen==='title'){ SFX.tap(); startIntro(); return; }
  if(screen==='choose'){
    for(let i=0;i<6;i++){ const cx=POS[i]; if(x>=cx-22&&x<=cx+22&&y>=92&&y<=172){ pick(i); return; } }
    return;
  }
  if(screen==='journey') journeyTap(x,y);
  else if(screen==='friend'){ const G=GAMES[FG.kind]; if(G.tap&&!FG.over) G.tap(FG,x,y); }
  else if(screen==='guest'){ const i=GS.btns.findIndex(b=>inR(x,y,b)); if(i>=0) guestAnswer(i); }
  else if(screen==='stars'){ if(inR(x,y,BTN)){ SFX.tap(); startFriend(); } }
  else if(screen==='end'){ if(EP===3&&inR(x,y,BTN)){ SFX.tap(); restart(); } }
}
function journeyTap(x,y,kb){
  const s=J.s, cam=Math.max(0,jTx()-95)*330/280;
  if(J.phase==='call'&&(kb||(x<80&&y>110))){ J.phase='arrive'; J.pt=0; SFX.honk(); }
  else if(J.phase==='machine'&&(kb||(Math.abs(x-(504-cam))<22&&y>98&&y<150))){ J.phase='process'; J.pt=0; SFX.button(); }
  else if(J.phase==='product'&&J.pt>0.5){
    const px=(s.prod==='pile'?578:604)-cam, rad=s.prod==='pile'?32:22;
    if(kb||(Math.abs(x-px)<rad&&y>104&&y<152)){ J.phase='fact'; J.pt=0; SFX.star();
      say(s.fact,{title:s.result,portrait:s,next:true,onNext:finishRound}); }
  }
}
cv.addEventListener('pointermove',e=>{ const r=cv.getBoundingClientRect(); MX=(e.clientX-r.left)/r.width*W; MY=(e.clientY-r.top)/r.height*H; });
cv.addEventListener('pointerleave',()=>{ MX=-99; MY=-99; });
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); const r=cv.getBoundingClientRect(); onTap((e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H); });
cv.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){ e.preventDefault(); startAudio();
    if(tb&&(!tbDone()||tb.next)){ onTap(160,20); return; }
    if(screen==='title') onTap(160,90);
    else if(screen==='journey') journeyTap(0,0,true);
    else if(screen==='friend'){ const G=GAMES[FG.kind]; if(G.kb&&!FG.over) G.kb(FG); }
    else if((screen==='stars'||screen==='end')&&BTN) onTap(BTN.x+BTN.w/2,BTN.y+BTN.h/2);
  } else if(/^[1-6]$/.test(e.key)){ startAudio(); const n=+e.key-1;
    if(screen==='choose') pick(n);
    else if(screen==='guest'&&n<2) guestAnswer(n);
    else if(screen==='friend'&&FG.kind==='winky'&&n<4) winkyTap(FG,BOT[n].x,120);
  }
  else if(e.key==='m'||e.key==='M'){ cycleAudio(); }
});

/* ---------- screens ---------- */
function logo(t,y0=8){
  ptxtC('LA FAMÍLIA',160,y0+4,K.ink,2,'outline',K.white);
  const word='RECICLATGE', s=4, x0=160-tw(word,s)/2;
  [...word].forEach((ch,i)=>{
    const x=x0+i*6*s, y=y0+22+Math.round(Math.sin(t*4+i*0.6)*2);
    drawStr(ch,x+2,y+3,s,(px,py)=>R(px-1,py-1,s+2,s+2,'#22752a'));
    drawStr(ch,x,y,s,(px,py)=>R(px-1,py-1,s+2,s+2,K.ink));
    drawStr(ch,x,y,s,(px,py,j)=>R(px,py,s,s,j<=1?EG2:(j>=5?EG3:BRAND)));
  });
}
function drawTitle(t){
  background(t*14,t);
  logo(t,6);
  ptxtC('EL VIATGE DELS RESIDUS',160,64,HY,2,'outline',K.ink);
  CAST.forEach((s,i)=>chr(s,POS[i],146,t+i*0.3,s.kind==='eco'?{}:{jump:Math.abs(Math.sin(t*4+i*0.9))*2}));
  button('JUGAR',160,96,HY,2);
}
function drawIntro(t){
  background(t*6,t);
  CAST.forEach((s,i)=>chr(s,POS[i],146,t+i*0.3,s.kind==='eco'?{}:{wave:i%2===0}));
  moebius(156,104,t,{});
}
function drawChoose(t){
  background(0,t);
  const answer=order[ri];
  POS.forEach((x,i)=>{
    const s=CAST[i]; let o={}, dx=0;
    const me=C.target===i;
    if(me&&C.phase==='wrong'){ dx=Math.round(Math.sin(C.pt*40)*2*(1-seg(C.pt,0,0.9))); o={sad:true}; }
    else if(me&&C.phase==='right'){ o=s.kind==='eco'?{carry:true,jump:Math.abs(Math.sin(C.pt*6))*5}:{jump:Math.abs(Math.sin(C.pt*6))*6,lidOpen:C.pt<0.35}; }
    else if(me&&C.phase==='fly'){ o={lidOpen:true,look:0}; if(s.kind==='eco') o={cheer:true}; }
    const top=chr(s,x+dx,146,T+i*0.3,o);
    if(me&&C.phase==='right'&&s.kind==='eco') drawItem(s,x,top-3);
    const tag=s.tag, w=tw(tag)+6;
    R(x-w/2,155,w,13,K.ink); ptxt(tag,x-w/2+3,157,K.white,1,'none'); R(x-w/2+2,165,w-4,2,s.kind==='eco'?OR:(s.c1==='#4a4f5a'?K.silver:s.c1));
  });
  const s=CAST[answer];
  if(C.phase==='fly'||(C.phase==='wrong'&&C.pt<0.5)){
    const tx=POS[C.target], ty=CAST[C.target].kind==='eco'?92:118;
    const p=C.phase==='fly'?seg(C.pt,0,0.5):1-seg(C.pt,0,0.5);
    drawItem(s,lerp(32,tx,p),lerp(44,ty,p)-Math.sin(p*Math.PI)*24,2);
  }
}
function drawJourney(t){
  const s=J.s, isEco=s.kind==='eco', ph=J.phase, pt=J.pt;
  const tx=jTx(), cam=Math.max(0,tx-95)*330/280;
  const after=['process','product','fact'].includes(ph)||screen==='stars';
  background(cam,t);
  facility(s,430-cam,138,t,after);
  pedestal(504-cam,t,ph==='machine',after);
  const lift=ph==='lift'?Math.round(Math.sin(seg(pt,0,1.2)*Math.PI)*14):0;
  if(isEco) bin(s.bin,112-cam,147-lift,lift>4);
  if(cam<200){
    const home=isEco?85:112;
    let o={wave:true};
    if(ph==='lift'&&!isEco&&lift>0) o={jump:lift,surprised:true,noShadow:true,lidOpen:lift>4};
    chr(s,home-cam,146,t,o);
  }
  if(ph==='lift'&&pt>0.4&&pt<1.1){ for(let k=0;k<4;k++){ const ph2=((pt-0.4)*3+k/4)%1; R(106+k*3-cam,(isEco?118:108)+ph2*30,2,2,s.c1==='#4a4f5a'?K.silver:s.c1); } }
  if(ph==='process'){
    for(let k=0;k<6;k++){ const p=seg(pt,k*0.1,0.5+k*0.1);
      if(p>0&&p<1){ const x=lerp(395,443,p)-cam, y=lerp(140,122,p)-Math.sin(p*Math.PI)*16; R(x-1,y-1,5,5,K.ink); R(x,y,3,3,s.c1==='#4a4f5a'?K.silver:s.c1); } }
    if(s.prod==='pile'){ pile(578-cam,146,t,seg(pt,1.0,2.2)); if(pt>1.4) bulb(504-cam,t,seg(pt,1.4,2.0)); }
    else if(pt>=1.0) drawItem(s,532+54*seg(pt,1.0,2.2)-cam,132);
  }
  if(['product','fact'].includes(ph)||screen==='stars'){
    const done=ph!=='product'||pt>0.6;
    if(s.prod==='pile'){ pile(578-cam,146,t,1); bulb(504-cam,t,1); }
    else {
      const p=ph==='product'?seg(pt,0,0.5):1;
      const x=lerp(590,604,p)-cam;
      let by=lerp(132,146,p)-Math.sin(p*Math.PI)*16;
      if(p>=1) by+=Math.round(Math.sin(t*4));
      if(ph==='product'&&pt<0.35) ring(x,128,Math.round(seg(pt,0,0.35)*18),HY);
      drawProd(s,x,Math.round(by));
      if(p>=1) for(let k=0;k<4;k++){ const an=t*3+k*Math.PI/2; spark(Math.round(x+Math.cos(an)*18),Math.round(130+Math.sin(an)*12),HY); }
    }
    const wp=ph==='product'?seg(pt,0,1.6):1;
    const wx=lerp(310,636,easeOut(wp));
    const sad=s.prod==='pile';
    const o=wp<1?{walk:true,look:1}:sad?{sad:true,look:-1}:{jump:Math.abs(Math.sin(t*5))*4};
    chr(s,wx-cam,146,t,o);
    if(ph==='product'&&done) arrowAt((s.prod==='pile'?578:604)-cam,s.prod==='pile'?112:104,t);
  }
  truck(tx-cam,168,s,t,ph==='arrive'||ph==='drive');
  if(ph==='call') arrowAt(s.van?18:32,118,t);
  if(ph==='machine') arrowAt(504-cam,102,t);
  // HUD
  const tot=score();
  const hud=`${tot}  ${ri+1}/6`; const hw=tw(hud)+22;
  R(W-hw-4,156,hw,14,K.ink); spr(STAR,W-hw,158,1); ptxt(hud,W-hw+12,160,K.white,1,'none');
}
function drawStars(t){
  const n=stars[ri]||0;
  const bx=60,by=58,bw=200,bh=104;
  R(bx,by+3,bw,bh,K.ink); R(bx,by,bw,bh,K.ink); R(bx+2,by+2,bw-4,bh-4,K.white); R(bx+4,by+4,bw-8,bh-8,K.navy);
  ptxtC('VIATGE COMPLETAT!',160,by+12,HY,1);
  for(let i=0;i<3;i++){ const on=i<n; const pop=on?Math.round(Math.max(0,1-seg(WT,0.15+i*0.25,0.45+i*0.25))*-6):0;
    spr(on&&WT>0.15+i*0.25?STAR:STAR_OFF,160-45+i*33-4,by+28+pop,3); }
  const msg=n===3?'A LA PRIMERA!':n===2?'MOLT BÉ!':'HO HAS ACONSEGUIT!';
  ptxtC(msg,160,by+62,K.white,1);
  button('SEGÜENT',160,by+84,HY,1);
}
function wipe(){ const p=1-WT/0.35; if(p<=0) return; for(let j=0;j<12;j++) for(let i=0;i<20;i++){ if((i+j)/30<p) R(i*16,j*16,16,16,K.ink); } }

function draw(){
  if(screen==='title') drawTitle(T);
  else if(screen==='intro') drawIntro(T);
  else if(screen==='choose') drawChoose(T);
  else if(screen==='journey'||screen==='stars') drawJourney(T);
  else if(screen==='friend') GAMES[FG.kind].draw(FG,T);
  else if(screen==='guest') guestDraw(T);
  else if(screen==='end') drawEnd(T);
  drawTB(T);
  if(screen==='stars') drawStars(T);
  speaker();
  wipe();
}

window.__debug={get:()=>({screen,ri,order,FG,GS,EP,score:score(),max:maxScore(),tb}),startFriendFor:(ci)=>{ order[ri]=ci; startFriend(); },startGuest:()=>startGuest(),startEnd:()=>startEnd(),newGame:()=>newGame()};
let last=performance.now();
function frame(now){ const dt=Math.min(0.05,(now-last)/1000); last=now; update(dt); draw(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
})();
</script>
